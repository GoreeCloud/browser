[build-system]
requires = ["setuptools>=77,<90", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goreecloud-browser"
version = "0.1.0.dev0"
description = "Linux-first native Qt desktop browser development preview"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "GoreeCloud"}]
dependencies = ["PySide6==6.11.3"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: X11 Applications :: Qt",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.scripts]
goreecloud-browser = "goreecloud_browser.app:main"

[tool.setuptools.packages.find]
include = ["goreecloud_browser*"]
