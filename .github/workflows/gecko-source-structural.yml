name: Gecko fork structural checks
on:
  pull_request:
    paths:
      - "goreecloud/**"
      - "browser/branding/goreecloud/**"
      - ".github/workflows/gecko-source-structural.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            goreecloud
            browser/branding/goreecloud
            browser/confvars.sh
            browser/config
            LICENSE
      - name: Unit tests and generated-asset integrity
        run: python3 -m unittest discover -s goreecloud/tests -v
      - name: Verify reproducible GTK branding assets
        run: python3 goreecloud/tools/generate_linux_branding.py --check
      - name: Static provenance and fail-closed integration registry
        run: python3 goreecloud/tools/validate_baseline.py
