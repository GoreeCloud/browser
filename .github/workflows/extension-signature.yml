name: GoreeCloud Browser Extension Signature

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-libsodium-signature:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact Browser source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: browser
          persist-credentials: false

      - name: Verify exact Browser source revision
        working-directory: browser
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Check out exact libsodium source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jedisct1/libsodium
          ref: 77e1ce5d6dee871c49ef211222ba18ef0c486bda
          path: libsodium
          persist-credentials: false

      - name: Verify libsodium provenance
        run: |
          test "$(git -C libsodium rev-parse HEAD)" = "77e1ce5d6dee871c49ef211222ba18ef0c486bda"
          grep -F "Version: 1.0.22" browser/third_party/libsodium/SOURCE_INFO
          grep -F "Upstream Commit: 77e1ce5d6dee871c49ef211222ba18ef0c486bda" browser/third_party/libsodium/SOURCE_INFO
          grep -F "License: ISC" browser/third_party/libsodium/SOURCE_INFO
          test -s browser/third_party/libsodium/LICENSE

      - name: Install libsodium build prerequisites
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config

      - name: Build exact libsodium dependency
        working-directory: libsodium
        run: |
          ./autogen.sh
          ./configure --prefix="$GITHUB_WORKSPACE/libsodium-install" --disable-shared
          make --jobs 2
          make install

      - name: Compile GCEX signature verifier smoke test
        working-directory: browser
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -Iinclude \
            -I"$GITHUB_WORKSPACE/libsodium-install/include" \
            apps/browser/extension_signature_smoke.cpp \
            src/extension_signature_sodium.cpp \
            "$GITHUB_WORKSPACE/libsodium-install/lib/libsodium.a" \
            -o goreecloud-browser-extension-signature-smoke

      - name: Run GCEX signature verifier smoke test
        working-directory: browser
        run: ./goreecloud-browser-extension-signature-smoke
