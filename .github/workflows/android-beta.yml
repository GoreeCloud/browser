name: GoreeCloud Browser Android Beta APK

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "assets/branding/**"
      - "docs/ANDROID_BETA.md"
      - ".github/workflows/android-beta.yml"
  push:
    branches:
      - main
    paths:
      - "apps/android/**"
      - "assets/branding/**"
      - "docs/ANDROID_BETA.md"
      - ".github/workflows/android-beta.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  EVALUATED_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  android-beta:
    name: Build installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out exact Browser source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EVALUATED_REVISION }}
          persist-credentials: false

      - name: Verify exact Browser source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVALUATED_REVISION"

      - name: Install exact Temurin Java 17
        shell: bash
        run: |
          set -euo pipefail
          archive="OpenJDK17U-jdk_x64_linux_hotspot_17.0.20.1_1.tar.gz"
          expected_sha256="3808d1d15e3ec6bd5b84057fb5d84c33d8a1536a258146bcea2e603fc726e08e"
          curl --fail --location --silent --show-error \
            --output "/tmp/${archive}" \
            "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/${archive}"
          printf '%s  %s\n' "$expected_sha256" "/tmp/${archive}" | sha256sum --check -
          java_home="$RUNNER_TEMP/temurin-17.0.20.1+1"
          mkdir -p "$java_home"
          tar -xzf "/tmp/${archive}" -C "$java_home" --strip-components=1
          printf 'JAVA_HOME=%s\n' "$java_home" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$java_home" >> "$GITHUB_PATH"
          "$java_home/bin/java" -version

      - name: Configure exact Android SDK command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "15859902"
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android 35 SDK
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure exact Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "8.9"
          cache-provider: basic

      - name: Validate launcher identity source boundary
        shell: bash
        run: python3 apps/android/scripts/check_launcher_identity.py

      - name: Test, lint, and assemble beta
        working-directory: apps/android
        shell: bash
        run: |
          gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK signature and identity
        shell: bash
        run: |
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          BADGING="apps/android/app/build/outputs/apk/debug/badging.txt"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          RESOURCES="apps/android/app/build/outputs/apk/debug/resources.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$BADGING"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump resources "$APK" | tee "$RESOURCES"
          grep -F "package: name='io.goreecloud.browser.beta'" "$BADGING"
          grep -F "versionCode='10007'" "$BADGING"
          grep -F "versionName='0.1.0-beta.1+android.7'" "$BADGING"
          grep -F "application-label:'GoreeCloud Browser Beta'" "$BADGING"
          grep -F ":mipmap/ic_launcher" "$RESOURCES"
          grep -F ":mipmap/ic_launcher_round" "$RESOURCES"
          grep -F ":drawable/ic_launcher_foreground" "$RESOURCES"
          grep -F ":drawable/ic_launcher_monochrome" "$RESOURCES"

      - name: Record exact source revision and SHA-256
        shell: bash
        run: |
          cd apps/android/app/build/outputs/apk/debug
          printf '%s\n' "$EVALUATED_REVISION" | tee SOURCE_REVISION
          sha256sum app-debug.apk | tee SHA256SUMS.txt

      - name: Upload installable beta APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goreecloud-browser-android-beta-${{ env.EVALUATED_REVISION }}
          if-no-files-found: error
          retention-days: 30
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/SHA256SUMS.txt
            apps/android/app/build/outputs/apk/debug/SOURCE_REVISION
            apps/android/app/build/outputs/apk/debug/badging.txt
            apps/android/app/build/outputs/apk/debug/resources.txt
