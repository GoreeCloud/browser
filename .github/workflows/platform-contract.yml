# yamllint disable rule:line-length
name: Platform Contract

"on":
  pull_request:
    paths:
      - goreecloud.platform.yaml
      - .github/workflows/platform-contract.yml
  push:
    branches:
      - main
    paths:
      - goreecloud.platform.yaml
      - .github/workflows/platform-contract.yml
  workflow_dispatch:

permissions:
  contents: read

# Development validation intentionally pins the exact source-valid Platform
# Contract 0.3 / Glaze UI 1.4.0 candidate from GoreeCloud/GoreeCloud PR #30.
# This exact pin is deterministic evidence only; it does not treat that draft
# central PR as merged, accepted, or production authority.
jobs:
  validate:
    uses: GoreeCloud/GoreeCloud/.github/workflows/reusable-platform-manifest.yml@5e10d17f10a4c12cc0a98b595646e4fc5992c1f2
    with:
      manifest-path: goreecloud.platform.yaml
