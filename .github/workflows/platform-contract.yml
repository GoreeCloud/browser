# yamllint disable rule:line-length
name: Platform Contract

"on":
  pull_request:
    paths:
      - goreecloud.platform.yaml
      - .github/workflows/platform-contract.yml
  push:
    branches:
      - main
    paths:
      - goreecloud.platform.yaml
      - .github/workflows/platform-contract.yml
  workflow_dispatch:

permissions:
  contents: read

# Development validation intentionally pins the exact source-valid Platform
# Contract 0.3 / Glaze UI 1.4.0 candidate from GoreeCloud/GoreeCloud PR #30.
# The candidate follows the authoritative seven-system governance model. This
# exact pin is deterministic evidence only; it does not treat that draft central
# PR as merged, accepted, or production authority.
jobs:
  validate:
    uses: GoreeCloud/GoreeCloud/.github/workflows/reusable-platform-manifest.yml@96701cc5f20c8e0deaad512d2a9f83e0411f3f18
    with:
      manifest-path: goreecloud.platform.yaml
