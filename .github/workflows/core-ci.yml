              for _ in $(seq 1 120); do
                if grep -Fq "[GoreeCloud CEF] windowless-ime-commit" "$2" &&
                   grep -Fq "[GoreeCloud CEF] main-frame-load-end status=200 url=https://example.com/#goreecloud-ime-ok" "$2"; then
                  ime_ready=1
                  break
                fi
                if ! kill -0 "$browser_pid" 2>/dev/null; then
                  break
                fi
                sleep 0.25
              done
              test "$ime_ready" -eq 1

              kill "$browser_pid" 2>/dev/null || true
              wait "$browser_pid" 2>/dev/null || true
              exit 0
            ' sh "${test_url}" "${log_file}"

          cat "${log_file}"

          grep -Fq "mode=windowless" "${log_file}"
          grep -Fq "[GoreeCloud GTK] windowless-ime-commit" "${log_file}"
          grep -Fq "[GoreeCloud CEF] windowless-ime-commit" "${log_file}"
          grep -Fq "[GoreeCloud CEF] main-frame-load-end status=200 url=https://example.com/#goreecloud-ime-ok" "${log_file}"
          if grep -Fq "*** stack smashing detected ***" "${log_file}"; then
            echo "CEF subprocess stack corruption detected during windowless IME smoke" >&2
            exit 1
          fi

