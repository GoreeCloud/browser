name: GoreeCloud Browser Core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-core:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DGOREECLOUD_ENABLE_CHROMIUM=OFF -DGOREECLOUD_ENABLE_CEF=OFF -DGOREECLOUD_ENABLE_LINUX_GTK_HOST=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-core-debug:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Configure
        run: cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DGOREECLOUD_ENABLE_CHROMIUM=OFF -DGOREECLOUD_ENABLE_CEF=OFF -DGOREECLOUD_ENABLE_LINUX_GTK_HOST=OFF
      - name: Build
        run: cmake --build build-debug --parallel
      - name: Test
        run: ctest --test-dir build-debug --output-on-failure

  linux-download-curl:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install libcurl development package
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Configure curl download transport
        run: cmake -S . -B build-curl -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DGOREECLOUD_ENABLE_CHROMIUM=OFF -DGOREECLOUD_ENABLE_CEF=OFF -DGOREECLOUD_ENABLE_LINUX_GTK_HOST=OFF -DGOREECLOUD_ENABLE_CURL_DOWNLOAD_TRANSPORT=ON
      - name: Build curl download transport
        run: cmake --build build-curl --parallel
      - name: Test download contracts
        run: ctest --test-dir build-curl --output-on-failure

  linux-gtk-beta-shell:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install GTK/X11 and libcurl development packages
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev pkg-config libcurl4-openssl-dev
      - name: Configure beta shell with live downloads
        run: cmake -S . -B build-gtk -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DGOREECLOUD_ENABLE_CHROMIUM=OFF -DGOREECLOUD_ENABLE_CEF=OFF -DGOREECLOUD_ENABLE_LINUX_GTK_HOST=ON -DGOREECLOUD_ENABLE_CURL_DOWNLOAD_TRANSPORT=ON
      - name: Build beta shell
        run: cmake --build build-gtk --parallel
      - name: Test Browser and download contracts
        run: ctest --test-dir build-gtk --output-on-failure


  linux-cef-bootstrap-contract:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Syntax-check CEF bootstrap and launch scripts
        run: |
          python3 -m py_compile scripts/bootstrap_cef_linux.py
          bash -n scripts/build_linux_render_beta.sh
          bash -n scripts/run_linux_render_beta.sh
      - name: Verify Linux GTK backend fallback contract
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          host = Path("src/platform/gtk_linux_glaze_host.cpp").read_text()
          runtime = Path("src/cef_runtime.cpp").read_text()
          scaffold = Path("src/chromium_runtime_scaffold.cpp").read_text()
          surface = Path("include/goreecloud/browser/native_engine_surface.hpp").read_text()
          runner = Path("include/goreecloud/browser/platform/gtk_linux_runner.hpp").read_text()
          runtime_smoke = Path("apps/browser/runtime_smoke.cpp").read_text()
          factory = Path("include/goreecloud/browser/runtime_engine_factory.hpp").read_text()
          adapter = Path("include/goreecloud/browser/chromium_adapter.hpp").read_text()
          cmake = Path("CMakeLists.txt").read_text()
          launcher = Path("packaging/linux/goreecloud-browser.in").read_text()

          assert "GC_REQUIRE(" in runtime_smoke
          assert re.search(r"(?<!static_)\bassert\(", runtime_smoke) is None
          assert "if (!display || !GDK_IS_X11_DISPLAY(display)) return false;" not in host
          assert "if (!display) return false;" in host
          assert "GOREECLOUD_BROWSER_FORCE_WINDOWLESS" in host
          assert "windowless-frame-presented" in host
          assert "windowless-popup-frame-presented" in host
          assert "NativeSurfaceFrameSink" in surface
          assert "present_software_popup_frame" in surface
          assert "clear_software_popup_frame" in surface
          assert "NativeSurfaceInputForwarder" in surface
          assert "NativeSurfaceDropForwarder" in surface
          assert "NativeDropData" in surface
          assert "NativeKeyEvent" in surface
          assert "send_key_event" in surface
          assert "NativeSurfaceTextInputForwarder" in surface
          assert "set_text_composition" in surface
          assert "commit_text" in surface
          assert "NativeSurfaceCursorSink" in surface
          assert "NativeCustomCursor" in surface
          assert "NativeSurfaceContextMenuSink" in surface
          assert "windowless-cursor-applied" in host
          assert "windowless-custom-cursor-applied" in host
          assert "windowless-context-menu-presented" in host
          assert "windowless-drop-result" in host
          assert "gtk_drag_dest_add_text_targets" in host
          assert "gtk_drag_dest_add_uri_targets" in host
          assert "safe_web_drop_url" in host
          assert "file://" not in host
          assert 'g_set_prgname("io.goreecloud.Browser")' in host
          assert "GOREECLOUD_BROWSER_USER_DATA_ROOT" in factory
          assert "user_data_root" in adapter
          assert "options.user_data_root" in scaffold
          assert "GOREECLOUD_BROWSER_INSTALL_RUNTIME_SUBDIR" in cmake
          assert 'INSTALL_RPATH "\\$ORIGIN"' in cmake
          assert "GOREECLOUD_BROWSER_RUNTIME_ROOT" in launcher
          assert "XDG_DATA_HOME" in launcher
          assert "GtkTabAction::move_left" in host
          assert "GtkTabAction::move_right" in host
          assert "close_accessible" in host
          assert "set_accessible_name(close, close_accessible.c_str())" in host
          client = Path("include/goreecloud/browser/cef_client.hpp").read_text()
          assert "apply_custom_cursor" in client
          assert "OnCursorChange" in client
          assert "OnPopupShow" in client
          assert "OnPopupSize" in client
          assert "PET_POPUP" in client
          assert "RunContextMenu" in client
          assert "SendMouseClickEvent" in runtime
          assert "SendMouseWheelEvent" in runtime
          assert "SendKeyEvent" in runtime
          assert "ImeSetComposition" in runtime
          assert "ImeCommitText" in runtime
          assert "ImeCancelComposition" in runtime
          assert "DragTargetDragEnter" in client
          assert "DragTargetDragOver" in client
          assert "DragTargetDrop" in client
          assert "UpdateDragCursor" in client
          assert "begin_windowless_drop" in runtime
          assert "SetAsWindowless" in runtime
          assert "cef.windowless_rendering = true" in scaffold
          assert "native Wayland embedding is not yet enabled" not in runner
          PY
      - name: Verify pinned CEF source contract without downloading CEF
        run: |
          python3 scripts/bootstrap_cef_linux.py --print-spec > /tmp/goreecloud-cef-spec.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = "152.0.6+g708dc14+chromium-152.0.7977.83"
          spec = json.loads(Path("/tmp/goreecloud-cef-spec.json").read_text())
          assert spec["cef_version"] == expected
          assert spec["chromium_version"] == "152.0.7977.83"
          assert spec["platform"] == "linux64"
          assert spec["distribution"] == "minimal"
          assert spec["archive"].endswith("_linux64_minimal.tar.bz2")
          assert "%2B" in spec["archive_url"]
          assert spec["checksum_url"].endswith(".sha1")
          assert spec["archive_sha1"] == "9711b86c105fb590da576fe5a829802f1a79d520"
          assert spec["archive_sha256"] == "daf8c2b6e63787d6a91d666205a8a4521419937eabaf47723738c86aea7135bd"

          cmake = Path("CMakeLists.txt").read_text()
          assert "GOREECLOUD_CEF_PINNED_VERSION" in cmake
          assert expected in cmake
          PY


  linux-cef-render-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install Linux CEF/GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 cmake ninja-build build-essential pkg-config \
            libgtk-3-dev libx11-dev libcurl4-openssl-dev \
            libnss3-dev libxss-dev libasound2-dev libcups2-dev \
            libdrm-dev libgbm-dev xvfb xauth xdotool procps dbus-x11
      - name: Bootstrap pinned CEF and build render candidate
        env:
          GOREECLOUD_CEF_CACHE_DIR: ${{ runner.temp }}/goreecloud-cef
          GOREECLOUD_BROWSER_CEF_BUILD_DIR: ${{ github.workspace }}/build-cef-render
        run: ./scripts/build_linux_render_beta.sh
      - name: Verify render-candidate runtime payload
        run: |
          test -x build-cef-render/goreecloud-browser
          test -f build-cef-render/libcef.so
          test -f build-cef-render/icudtl.dat
          test -d build-cef-render/locales
          test -f build-cef-render/resources.pak
          test -f build-cef-render/chrome_100_percent.pak
          test -f build-cef-render/v8_context_snapshot.bin
          test -f build-cef-render/assets/branding/goreecloud-browser.svg
      - name: Stage and launch installed Linux CEF runtime
        env:
          GOREECLOUD_BROWSER_RUNTIME_DIAGNOSTICS: "1"
          GOREECLOUD_BROWSER_FORCE_WINDOWLESS: "1"
        run: |
          set -euo pipefail

          stage="${RUNNER_TEMP}/goreecloud-install"
          xdg_data="${RUNNER_TEMP}/goreecloud-install-xdg"
          log_file="${RUNNER_TEMP}/goreecloud-installed-runtime.log"
          rm -rf "${stage}" "${xdg_data}"
          mkdir -p "${stage}" "${xdg_data}"

          cmake --install build-cef-render --prefix "${stage}"

          launcher="${stage}/bin/goreecloud-browser"
          runtime="${stage}/libexec/goreecloud-browser"

          test -x "${launcher}"
          test -x "${runtime}/goreecloud-browser"
          test -x "${runtime}/goreecloud-browser-subprocess"
          test -f "${runtime}/libcef.so"
          test -f "${runtime}/libEGL.so"
          test -f "${runtime}/libGLESv2.so"
          test -f "${runtime}/libvk_swiftshader.so"
          test -f "${runtime}/libvulkan.so.1"
          test -f "${runtime}/v8_context_snapshot.bin"
          test -f "${runtime}/vk_swiftshader_icd.json"
          test -f "${runtime}/icudtl.dat"
          test -f "${runtime}/resources.pak"
          test -f "${runtime}/chrome_100_percent.pak"
          test -f "${runtime}/chrome_200_percent.pak"
          test -d "${runtime}/locales"
          test -f "${runtime}/assets/branding/goreecloud-browser.svg"
          test ! -d "${runtime}/profile-cache"

          # Model production sandbox ownership for the staged runtime.
          sudo chown root:root "${runtime}/chrome-sandbox"
          sudo chmod 4755 "${runtime}/chrome-sandbox"

          : > "${log_file}"
          trap 'status=$?; if [[ $status -ne 0 ]]; then echo "=== GoreeCloud installed runtime failure log ===" >&2; cat "${log_file}" >&2 || true; fi; trap - EXIT; exit "$status"' EXIT

          timeout --signal=TERM --kill-after=5s 90s \
            dbus-run-session -- \
            xvfb-run -a -s "-screen 0 1280x800x24" \
            env XDG_DATA_HOME="${xdg_data}" \
            "${launcher}" https://example.com/ >"${log_file}" 2>&1 &
          runtime_pid=$!

          runtime_ready=0
          for _ in $(seq 1 90); do
            if grep -Fq "[GoreeCloud CEF] main-frame-load-end status=200 url=https://example.com/" "${log_file}"; then
              runtime_ready=1
              break
            fi
            if ! kill -0 "${runtime_pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          kill "${runtime_pid}" 2>/dev/null || true
          wait "${runtime_pid}" 2>/dev/null || true

          cat "${log_file}"

          test "${runtime_ready}" -eq 1
          grep -Fq "[GoreeCloud CEF] CefInitialize completed" "${log_file}"
          grep -Fq "[GoreeCloud CEF] main-frame-load-end status=200 url=https://example.com/" "${log_file}"
          test -d "${xdg_data}/goreecloud/browser/cef"
          test ! -d "${runtime}/profile-cache"

          if grep -Fq "GoreeCloud Browser refuses to initialize Chromium with the sandbox disabled" "${log_file}"; then
            echo "Installed launcher disabled Chromium sandboxing" >&2
            exit 1
          fi
          if grep -Fq "cache_path directory (profile) is not an absolute path" "${log_file}"; then
            echo "Installed launcher produced a relative CEF profile path" >&2
            exit 1
          fi

      - name: Launch sandboxed CEF runtime under Xvfb
        env:
          GOREECLOUD_BROWSER_CEF_BUILD_DIR: ${{ github.workspace }}/build-cef-render
          GOREECLOUD_BROWSER_RUNTIME_DIAGNOSTICS: "1"
        run: |
          set -euo pipefail

          if [[ -f build-cef-render/chrome-sandbox ]]; then
            sudo chown root:root build-cef-render/chrome-sandbox
            sudo chmod 4755 build-cef-render/chrome-sandbox
          fi

          log_file="${RUNNER_TEMP}/goreecloud-cef-runtime.log"
          renderer_file="${RUNNER_TEMP}/goreecloud-cef-renderers.txt"
          : > "${log_file}"
          trap 'status=$?; if [[ $status -ne 0 ]]; then echo "=== GoreeCloud CEF failure log ===" >&2; cat "${log_file}" >&2 || true; fi; trap - EXIT; exit "$status"' EXIT
          : > "${renderer_file}"

          timeout --signal=TERM --kill-after=5s 90s \
            dbus-run-session -- \
            xvfb-run -a -s "-screen 0 1280x800x24" \
            ./scripts/run_linux_render_beta.sh https://example.com/ \
            >"${log_file}" 2>&1 &
          runtime_pid=$!

          runtime_ready=0
          for _ in $(seq 1 90); do
            renderer_ready=0
            load_ready=0

            if pgrep -af -- "--type=renderer" > "${renderer_file}"; then
              renderer_ready=1
            fi
            if grep -Fq "[GoreeCloud CEF] main-frame-load-end status=200 url=https://example.com/" "${log_file}"; then
              load_ready=1
            fi

            if [[ "${renderer_ready}" -eq 1 && "${load_ready}" -eq 1 ]]; then
              runtime_ready=1
              break
            fi

            if ! kill -0 "${runtime_pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          set +e
          wait "${runtime_pid}"
          runtime_status=$?
          set -e

          cat "${log_file}"
          cat "${renderer_file}"

          test "${runtime_ready}" -eq 1
          test -s "${renderer_file}"
          grep -Fq "[GoreeCloud CEF] main-frame-load-end status=200 url=https://example.com/" "${log_file}"
          if grep -Fq "[GoreeCloud CEF] main-frame-load-error" "${log_file}"; then
            echo "CEF main-frame navigation reported a load error" >&2
            exit 1
          fi
          if grep -Fq "cache_path directory (profile) is not an absolute path" "${log_file}"; then
            echo "CEF profile cache path regressed to a relative path" >&2
            exit 1
          fi
          if grep -Fq "*** stack smashing detected ***" "${log_file}"; then
            echo "CEF subprocess stack corruption detected during runtime smoke" >&2
            exit 1
          fi

          if [[ "${runtime_status}" -ne 0 && "${runtime_status}" -ne 124 ]]; then
            echo "CEF runtime exited unexpectedly with status ${runtime_status}" >&2
            exit "${runtime_status}"
          fi

      - name: Exercise CEF windowless page pixels, custom/standard cursors, pointer input, and context menu under Xvfb
        env:
          GOREECLOUD_BROWSER_CEF_BUILD_DIR: ${{ github.workspace }}/build-cef-render
          GOREECLOUD_BROWSER_RUNTIME_DIAGNOSTICS: "1"
          GOREECLOUD_BROWSER_FORCE_WINDOWLESS: "1"
        run: |
          set -euo pipefail

          if [[ -f build-cef-render/chrome-sandbox ]]; then
            sudo chown root:root build-cef-render/chrome-sandbox
            sudo chmod 4755 build-cef-render/chrome-sandbox
          fi

          log_file="${RUNNER_TEMP}/goreecloud-cef-windowless-input.log"
          : > "${log_file}"
          trap 'status=$?; if [[ $status -ne 0 ]]; then echo "=== GoreeCloud CEF failure log ===" >&2; cat "${log_file}" >&2 || true; fi; trap - EXIT; exit "$status"' EXIT
          test_url="$(python3 - <<'PY'
          import base64
          import urllib.parse

          svg = (
              '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16">'
              '<rect width="16" height="16" fill="#111"/>'
              '<rect x="3" y="3" width="10" height="10" fill="#fff"/>'
              '<rect x="6" y="6" width="4" height="4" fill="#111"/>'
              '</svg>'
          )
          encoded = base64.b64encode(svg.encode("utf-8")).decode("ascii")
          html = f"""
          <div id="custom" style="position:fixed;left:0;top:0;width:50%;height:100%;
              background:#f6f6f6;cursor:url(data:image/svg+xml;base64,{encoded}) 1 1,crosshair">
            custom cursor
          </div>
          <a id="continue" href="https://example.com/" style="position:fixed;right:0;top:0;
              width:50%;height:100%;display:block;background:#fff">continue</a>
          """
          print("data:text/html," + urllib.parse.quote(html, safe=""))
          PY
          )"

          timeout --signal=TERM --kill-after=5s 90s \
            dbus-run-session -- \
            xvfb-run -a -s "-screen 0 1280x800x24" \
            sh -c '
              set -e
              ./scripts/run_linux_render_beta.sh "$1" >"$2" 2>&1 &
              browser_pid=$!

              window_id=""
              for _ in $(seq 1 60); do
                window_id=$(xdotool search --onlyvisible --name "GoreeCloud Browser" 2>/dev/null | head -n1 || true)
                if [ -n "$window_id" ] && grep -Fq "[GoreeCloud GTK] windowless-frame-presented" "$2"; then
                  break
                fi
                sleep 0.25
              done

              test -n "$window_id"

              xdotool mousemove --window "$window_id" 320 420
              custom_cursor_ready=0
              for _ in $(seq 1 40); do
                if grep -Fq "[GoreeCloud CEF] windowless-custom-cursor-change" "$2" &&
                   grep -Fq "[GoreeCloud GTK] windowless-custom-cursor-applied" "$2"; then
                  custom_cursor_ready=1
                  break
                fi
                if ! kill -0 "$browser_pid" 2>/dev/null; then
                  break
                fi
                sleep 0.25
              done
              test "$custom_cursor_ready" -eq 1

              xdotool mousemove --window "$window_id" 960 420
              cursor_ready=0
              for _ in $(seq 1 40); do
                if grep -Fq "[GoreeCloud GTK] windowless-cursor-applied type=hand" "$2"; then
                  cursor_ready=1
                  break
                fi
                if ! kill -0 "$browser_pid" 2>/dev/null; then
                  break
                fi
                sleep 0.25
              done
              test "$cursor_ready" -eq 1

              xdotool click 5
              sleep 0.25

              # Exercise the Browser-owned OSR context-menu bridge on the
              # deterministic data-page link before network navigation. Doing
              # this after navigation introduced a timing race where CEF could
              # receive the right-click while the newly loaded page was still
              # settling, causing the menu assertion to fail and the private
              # dbus-run-session to tear down underneath the live renderer.
              xdotool click 3

              menu_ready=0
              for _ in $(seq 1 40); do
                if grep -Fq "[GoreeCloud GTK] windowless-context-menu-presented" "$2"; then
                  menu_ready=1
                  break
                fi
                if ! kill -0 "$browser_pid" 2>/dev/null; then
                  break
                fi
                sleep 0.25
              done
              test "$menu_ready" -eq 1

              xdotool key Escape

              menu_closed=0
              for _ in $(seq 1 40); do
                if grep -Fq "[GoreeCloud CEF] windowless-context-menu-result canceled" "$2"; then
                  menu_closed=1
                  break
                fi
                sleep 0.25
              done
              test "$menu_closed" -eq 1

              sleep 0.25
              xdotool click 1

              navigation_ready=0
              for _ in $(seq 1 120); do
                if grep -Fq "[GoreeCloud CEF] windowless-pointer-wheel" "$2" &&
                   grep -Fq "[GoreeCloud CEF] windowless-pointer-button" "$2" &&
                   grep -Fq "[GoreeCloud CEF] main-frame-load-end status=200 url=https://example.com/" "$2"; then
                  navigation_ready=1
                  break
                fi
                if ! kill -0 "$browser_pid" 2>/dev/null; then
                  break
                fi
                sleep 0.25
              done
              test "$navigation_ready" -eq 1

              kill "$browser_pid" 2>/dev/null || true
              wait "$browser_pid" 2>/dev/null || true
              exit 0
            ' sh "${test_url}" "${log_file}"

          cat "${log_file}"

          grep -Fq "mode=windowless" "${log_file}"
          grep -Fq "[GoreeCloud GTK] windowless-frame-presented" "${log_file}"
          grep -Fq "[GoreeCloud CEF] windowless-custom-cursor-change" "${log_file}"
          grep -Fq "[GoreeCloud GTK] windowless-custom-cursor-applied" "${log_file}"
          grep -Fq "[GoreeCloud CEF] windowless-cursor-change type=hand" "${log_file}"
          grep -Fq "[GoreeCloud GTK] windowless-cursor-applied type=hand" "${log_file}"
          grep -Fq "[GoreeCloud CEF] windowless-pointer-wheel" "${log_file}"
          grep -Fq "[GoreeCloud CEF] windowless-pointer-button" "${log_file}"
          grep -Fq "[GoreeCloud CEF] main-frame-load-end status=200 url=https://example.com/" "${log_file}"
          grep -Fq "[GoreeCloud CEF] windowless-context-menu-request" "${log_file}"
          grep -Fq "[GoreeCloud GTK] windowless-context-menu-presented" "${log_file}"
          grep -Fq "[GoreeCloud CEF] windowless-context-menu-result canceled" "${log_file}"
          if grep -Fq "Window handle is required for default OSR context menu" "${log_file}"; then
            echo "CEF fell back to the native-window OSR context menu" >&2
            exit 1
          fi
          if grep -Fq "*** stack smashing detected ***" "${log_file}"; then
            echo "CEF subprocess stack corruption detected during windowless input smoke" >&2
            exit 1
          fi

      - name: Exercise CEF windowless popup rendering under Xvfb
        env:
