name: Browser source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # Match the audited Linux/Noble package baseline.
    timeout-minutes: 15
    env:
      GC_BROWSER_FILTER_NETWORK: "off" # CI must not contact public list servers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # Upstream v4 tag verified 2026-11-07
        with:
          persist-credentials: false # Do not retain the read-only token in .git/config
      - name: Refuse retained checkout HTTP authentication headers
        run: |
          git rev-parse --is-inside-work-tree | grep -qx true
          if git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo '::error::Checkout retained a Git authentication header' >&2
            exit 1
          fi
      - name: Refuse movable GitHub Actions refs and write-permission drift
        run: python3 scripts/linux/check_action_pins.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # Upstream v5.6.0 tag verified 2026-11-07
        with:
          python-version: "3.12"
      - name: Compile and test core
        run: |
          python -m compileall -q goreecloud_browser tests
          python -m unittest discover -s tests -v
      - name: Verify same-run reproducible wheel and legal notice integrity (no publish)
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/browser-wheel-a" "$RUNNER_TEMP/browser-wheel-b"
          python -m pip wheel --disable-pip-version-check --no-deps --no-cache-dir \
            --wheel-dir "$RUNNER_TEMP/browser-wheel-a" .
          python -m pip wheel --disable-pip-version-check --no-deps --no-cache-dir \
            --wheel-dir "$RUNNER_TEMP/browser-wheel-b" .
          python scripts/linux/verify_wheel_integrity.py \
            "$RUNNER_TEMP"/browser-wheel-a/*.whl --source-root .
          python scripts/linux/verify_wheel_integrity.py \
            "$RUNNER_TEMP"/browser-wheel-b/*.whl --source-root .
          cmp "$RUNNER_TEMP"/browser-wheel-a/*.whl \
            "$RUNNER_TEMP"/browser-wheel-b/*.whl
          python -m pip install --disable-pip-version-check --no-deps \
            --target "$RUNNER_TEMP/browser-wheel-install" \
            "$RUNNER_TEMP"/browser-wheel-a/*.whl
          ( cd "$RUNNER_TEMP" && \
            PYTHONPATH="$RUNNER_TEMP/browser-wheel-install" \
            python -c 'from pathlib import Path; import importlib.metadata as im; import goreecloud_browser as gc; p=Path(gc.__file__).resolve(); assert p.is_relative_to(Path("browser-wheel-install").resolve()); assert gc.__version__==im.version("goreecloud-browser"); assert (p.parent/"assets/prism-tabs-v5.svg").is_file(); print("Isolated wheel import and branding PASS")' )
          sha256sum "$RUNNER_TEMP"/browser-wheel-a/*.whl
          echo "Same-run wheel bytes, wheel RECORD, source, and legal notices verified"
      - name: Install required Linux Qt shared libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 \
            libxcb-randr0 libxcb-render-util0 libxcb-image0 libxcb-xkb1 \
            libxcb-xfixes0 libxcb-shape0 libxcb-xinput0 \
            desktop-file-utils xvfb xauth openssl
      - name: Install pinned Qt bindings
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify Qt app imports
        run: python -c "from goreecloud_browser.app import BrowserWindow, PrivacyInterceptor"
      - name: Wardveil audited Qt WebEngine Chromium patch baseline
        run: python scripts/linux/check_webengine_patch_baseline.py
      - name: Install local Python package
        run: |
          python -m pip install --disable-pip-version-check --no-deps .
          python -m pip check
      - name: Linux native Qt and local HTTP smoke
        env:
          GC_BROWSER_QT_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
          XDG_CONFIG_HOME: ${{ runner.temp }}/goreecloud-browser-config
          XDG_DATA_HOME: ${{ runner.temp }}/goreecloud-browser-data
        run: python -m unittest discover -s tests -p 'test_linux_smoke.py' -v
      - name: Linux offscreen HTTP navigation integrity (loopback)
        env:
          GC_BROWSER_QT_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python -m unittest discover -s tests -p 'test_linux_network_smoke.py' -v
      - name: Linux local async antivirus gate (test-double scanner, offscreen)
        env:
          GC_BROWSER_QT_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python -m unittest discover -s tests -p 'test_linux_antimalware_smoke.py' -v
      - name: Real Ubuntu ClamAV EICAR and scan-limit gate (isolated, offscreen)
        timeout-minutes: 4
        run: python scripts/linux/run_clamav_engine_acceptance.py
      - name: Linux offscreen download staging and no-overwrite smoke
        env:
          GC_BROWSER_QT_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python -m unittest discover -s tests -p 'test_linux_download_smoke.py' -v
      - name: Linux offscreen narrow native Home and New Tab layout
