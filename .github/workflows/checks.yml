name: Browser source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test core
        run: |
          python -m compileall -q goreecloud_browser tests
          python -m unittest discover -s tests -v
      - name: Install pinned Qt bindings
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify Qt app imports
        run: python -c "from goreecloud_browser.app import BrowserWindow, PrivacyInterceptor"
