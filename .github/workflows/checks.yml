          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: xvfb-run -a -s '-screen 0 1280x800x24' python -m unittest discover -s tests -p 'test_linux_smoke.py' -v
      - name: Linux X11 HTTP navigation integrity (Xvfb)
