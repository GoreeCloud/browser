name: Browser source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # Match the audited Linux/Noble package baseline.
    timeout-minutes: 15
    env:
      GC_BROWSER_FILTER_NETWORK: "off" # CI must not contact public list servers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test core
        run: |
          python -m compileall -q goreecloud_browser tests
          python -m unittest discover -s tests -v
      - name: Install required Linux Qt shared libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 \
            libxcb-randr0 libxcb-render-util0 libxcb-image0 libxcb-xkb1 \
            libxcb-xfixes0 libxcb-shape0 libxcb-xinput0 \
            desktop-file-utils xvfb xauth openssl
      - name: Install pinned Qt bindings
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify Qt app imports
        run: python -c "from goreecloud_browser.app import BrowserWindow, PrivacyInterceptor"
      - name: Install local Python package
        run: |
          python -m pip install --disable-pip-version-check --no-deps .
          python -m pip check
      - name: Linux native Qt and local HTTP smoke
        env:
          GC_BROWSER_QT_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
          XDG_CONFIG_HOME: ${{ runner.temp }}/goreecloud-browser-config
          XDG_DATA_HOME: ${{ runner.temp }}/goreecloud-browser-data
        run: python -m unittest discover -s tests -p 'test_linux_smoke.py' -v
      - name: Linux offscreen HTTP navigation integrity (loopback)
        env:
          GC_BROWSER_QT_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python -m unittest discover -s tests -p 'test_linux_network_smoke.py' -v
      - name: Linux local async antivirus gate (test-double scanner, offscreen)
        env:
          GC_BROWSER_QT_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python -m unittest discover -s tests -p 'test_linux_antimalware_smoke.py' -v
      - name: Real Ubuntu ClamAV EICAR and scan-limit gate (isolated, offscreen)
        timeout-minutes: 4
        run: python scripts/linux/run_clamav_engine_acceptance.py
      - name: Linux offscreen download staging and no-overwrite smoke
        env:
          GC_BROWSER_QT_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python -m unittest discover -s tests -p 'test_linux_download_smoke.py' -v
      - name: Linux offscreen narrow native Home and New Tab layout
        env:
          GC_BROWSER_QT_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python -m unittest discover -s tests -p 'test_linux_layout_smoke.py' -v
      - name: Linux native light toolbar, omnibox and Settings (offscreen)
        env:
          GC_BROWSER_QT_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python -m unittest discover -s tests -p 'test_linux_chrome_smoke.py' -v
      - name: Linux content-security Webspace policy (offscreen)
        env:
          GC_BROWSER_QT_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python -m unittest discover -s tests -p 'test_linux_content_security_smoke.py' -v
      - name: Linux actual local-file separation (offscreen)
        env:
          GC_BROWSER_QT_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python -m unittest discover -s tests -p 'test_linux_file_access_smoke.py' -v
      - name: Linux strict HTTPS certificate rejection (offscreen)
        env:
          GC_BROWSER_QT_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python -m unittest discover -s tests -p 'test_linux_tls_rejection_smoke.py' -v
      - name: Linux sandbox-bypass startup refusal (offscreen)
        env:
          GC_BROWSER_QT_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python -m unittest discover -s tests -p 'test_linux_sandbox_guard_smoke.py' -v
      - name: Linux native manager panels (offscreen)
        env:
          GC_BROWSER_QT_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python -m unittest discover -s tests -p 'test_linux_panels_smoke.py' -v
      - name: Linux exact-host Privacy Shield exceptions (offscreen)
        env:
          GC_BROWSER_QT_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python -m unittest discover -s tests -p 'test_linux_site_exceptions_smoke.py' -v
      - name: Linux real WebEngine site-exception HTTP boundary (offscreen)
        env:
          GC_BROWSER_QT_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: '--disable-gpu --no-proxy-server --host-resolver-rules="MAP news.browser-test.invalid 127.0.0.1, MAP ads.browser-test.invalid 127.0.0.1"'
        run: python -m unittest discover -s tests -p 'test_linux_site_exception_network_smoke.py' -v
      - name: Linux stored website permission review and revocation (offscreen)
        env:
          GC_BROWSER_QT_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python -m unittest discover -s tests -p 'test_linux_permissions_smoke.py' -v
      - name: Linux Webspace cookie isolation over loopback HTTP (offscreen)
        env:
          GC_BROWSER_QT_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python -m unittest discover -s tests -p 'test_linux_webspaces_smoke.py' -v
      - name: Linux subscription filtering (offline fixture)
        env:
          GC_BROWSER_QT_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python -m unittest discover -s tests -p 'test_linux_filter_interceptor_smoke.py' -v
      - name: Linux HTTP proxy routing over loopback (offscreen)
        env:
          GC_BROWSER_QT_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python -m unittest discover -s tests -p 'test_linux_proxy_smoke.py' -v
      - name: Linux X11 Qt and local HTTP smoke (Xvfb)
        env:
          GC_BROWSER_QT_SMOKE: "1"
          QT_QPA_PLATFORM: xcb
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: xvfb-run -a -s '-screen 0 1280x800x24' python -m unittest discover -s tests -p 'test_linux_smoke.py' -v
      - name: Linux X11 HTTP navigation integrity (Xvfb)
        env:
          GC_BROWSER_QT_SMOKE: "1"
