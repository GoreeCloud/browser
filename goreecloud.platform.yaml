schema_version: '0.4'

component:
  type: application
  id: goreecloud-browser
  product_name: GoreeCloud Browser
  repository: GoreeCloud/browser

lifecycle: development
version: 0.1.0-beta.1

supported_platforms:
  - linux
  - android

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - SPECIFICATIONS.md
      - docs/HEALTH_READINESS_CONTRACT.md
      - include/goreecloud/browser/health.hpp
    notes: Browser now has a bounded privacy-safe local liveness/readiness source contract suitable for a future authorized Manager adapter, but no accepted Manager runtime integration, operational-status publication, target-environment monitoring, or production acceptance exists.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - SPECIFICATIONS.md
      - docs/SEARCH_INDEX_INTEGRATION.md
    notes: Browser has privacy-protective source defaults, minimized Search request construction, and explicit Privacy Shield authority boundaries, but accepted producer-authoritative runtime decisions, authenticated requester transport, and complete Browser privacy acceptance remain unavailable.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
      - docs/WARDVEIL_DOWNLOAD_SCANNING.md
    notes: Browser contains a fail-closed source-level Wardveil download-release contract and Android downloads remain blocked rather than bypassing it, but authenticated runtime Wardveil integration, scanner health, quarantine evidence, and production security acceptance are incomplete.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
      - docs/BETA_0_1.md
    notes: Browser has source-level normal-session recovery/checkpoint boundaries and excludes Private and Isolated Private state before persistence, but accepted Everkeep backup, durable protected recovery storage, restore execution, migration, rollback, and production continuity acceptance remain incomplete.
  glaze_ui:
    result: applicable-blocked
    version: '1.6.0'
    evidence:
      - README.md
      - SPECIFICATIONS.md
      - docs/GLAZE_UI_ADOPTION.md
    notes: Browser source maps to exact Official Stable GLAZE UI V1.6 / 1.6.0 release source a7180679ea851389e0f3004515f9a25f420e716d and carries a repository-local Linux desktop presentation tranche. Glaze remains applicable-blocked because rendered/native visual, accessibility, large-text, Reduced Transparency/Contrast/Motion, localization/RTL, adaptive/form-factor, representative-device, performance, rollback, Human Visual Excellence, renderer-integrated, release, and production acceptance remain incomplete.
  mesh:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - SPECIFICATIONS.md
    notes: Browser has a source-level fail-closed first-party capability consumer boundary, but accepted GoreeCloud Mesh registration, discovery, transport, event, dependency, and runtime coordination evidence are incomplete.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - SPECIFICATIONS.md
      - docs/SEARCH_INDEX_INTEGRATION.md
    notes: GoreeCloud Identity remains authoritative for Browser profiles, synchronization identity, device authorization, account-bound preferences, authentication, requester identity, and authorization; accepted runtime Identity integration and direct-service authentication for protected Search delegation remain incomplete.
  policy:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - SPECIFICATIONS.md
      - goreecloud.platform.yaml
    notes: GoreeCloud Policy is applicable to Browser policy representation, evaluation, decisions, enforcement coordination, explanation, freshness, and evidence, but no accepted Browser runtime Policy integration or exact-release policy acceptance exists.
  observability:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - SPECIFICATIONS.md
      - goreecloud.platform.yaml
      - docs/HEALTH_READINESS_CONTRACT.md
      - include/goreecloud/browser/health.hpp
    notes: Browser now has a privacy-minimized local health/readiness source contract with bounded dependency/freshness state, but no accepted Observability exporter, runtime telemetry transport, operational evidence publication, alerting, target-environment validation, or exact-release observability acceptance exists.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Protect approved durable normal-profile Browser state through the accepted Everkeep recovery model while excluding Private and Isolated Private browsing state from ordinary persistence and backup.
      - Keep credentials, passkeys, reusable secrets, and other Vault-owned protected material outside ordinary Browser backup payloads unless an explicitly protected recovery contract requires them.
  restore:
    required: true
    requirements:
      - Validate restoration of supported Browser-owned durable state into a clean environment before Stable or production acceptance.
      - Verify protected recovery storage, session checkpoint restoration, migration compatibility, failure handling, and rollback against the exact release candidate.
  export:
    required: true
    requirements:
      - Provide documented user-controlled export for portable Browser-owned user data that is approved for export, such as history, preferences, and local Browser state where applicable.
      - Exclude credentials, passkeys, Wardveil trust evidence, private browsing state, and unrelated protected platform-system data from ordinary exports.
  portability:
    required: true
    requirements:
      - Keep Browser-owned canonical user state in documented GoreeCloud schemas rather than relying on Chromium profile formats as the permanent source of truth.
      - Preserve migration paths across supported engine and platform implementations for portable approved data.

external_dependencies:
  - name: android-system-webview-chromium
    purpose: Rendering-engine dependency for the Android beta; GoreeCloud Browser retains ownership of Browser chrome, navigation/search policy, state, privacy/security integration, and application behavior.
    required: true
    version_constraint: null
  - name: chromium-cef
    purpose: Rendering-engine foundation for the desktop render-capable path while GoreeCloud-owned Browser layers remain separated behind explicit engine interfaces.
    required: false
    version_constraint: null

compatibility:
  platform_contract: '0.4'
  glaze_ui_required: '1.6.0'
  requires:
    - goreecloud-platform-contract==0.4
    - glaze-ui==1.6.0
  provides:
    - browser-engine-layer
    - browser-native-shell-beta

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - SPECIFICATIONS.md
    - docs/BETA_0_1.md
    - docs/ANDROID_BETA.md
    - docs/GLAZE_UI_ADOPTION.md
    - docs/WARDVEIL_DOWNLOAD_SCANNING.md
  blockers:
    - GoreeCloud Manager operational integration and acceptance are incomplete.
    - Producer-authoritative Privacy Shield runtime integration, authenticated Search requester transport, and complete Browser privacy acceptance are incomplete.
    - Authenticated Wardveil Security runtime download verification, scanner health, quarantine evidence, and production security acceptance are incomplete.
    - Everkeep protected durable backup, clean-environment restore, migration, rollback, and production continuity acceptance are incomplete.
    - Browser source maps to current Official Stable GLAZE UI V1.6 / 1.6.0, but Browser-local rendered/native, accessibility, large-text, Reduced Transparency/Contrast/Motion, localization/RTL, adaptive/form-factor, representative-device, performance, rollback, Human Visual Excellence, renderer-integrated, release, and production acceptance remain incomplete.
    - GoreeCloud Mesh registration, discovery, transport, dependency/event integration, and runtime acceptance are incomplete.
    - GoreeCloud Identity profile, session, authorization, synchronization identity, device authorization, requester/service identity, direct-service authentication, and runtime acceptance are incomplete.
    - GoreeCloud Policy decision, enforcement-coordination, explanation, freshness, and policy-evidence runtime acceptance are incomplete.
    - GoreeCloud Observability health, diagnostics, performance, dependency-health, freshness, provenance, and operational-evidence runtime acceptance are incomplete.
    - GoreeCloud Sync remains a separate application/service capability; dataset contracts, runtime registration, authenticated synchronization, reconciliation, deletion/conflict behavior, and cross-device acceptance are incomplete, and excluded private/credential/security state must not be synchronized by default.
    - Browser has a Development source-level local health/readiness contract, but no accepted publication adapter, Manager/Observability runtime integration, target-environment monitoring, alerting, or production health/readiness acceptance exists.
    - Desktop render-capable CEF/Chromium integration and its real-runtime acceptance remain incomplete.
    - Android production signing, representative-device acceptance, accessibility, localization/RTL, migration, update, rollback, and release provenance remain incomplete.
    - No Stable or production-approved GoreeCloud Browser release evidence is declared.
